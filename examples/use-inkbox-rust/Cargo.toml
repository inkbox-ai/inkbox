[package]
name = "use-inkbox-rust"
version = "0.1.0"
edition = "2021"
# Matches the `inkbox` crate's own rust-version. The floor is set by the
# transitive graph (edition-2024 manifests that cargo < 1.85 cannot parse, and
# icu_* 2.2 requiring 1.86), not by any source here. Cargo.lock is committed so
# the number stays reproducible, and CI checks it on 1.86.0 and stable.
rust-version = "1.86"
publish = false
# Plain `cargo run` runs example 01; the rest go through `cargo run --bin <name>`.
default-run = "01-identity-and-email"

[dependencies]
inkbox = "0.5"

# To run against a local checkout of the SDK instead of the published crate,
# uncomment:
# [patch.crates-io]
# inkbox = { path = "../../sdk/rust" }
