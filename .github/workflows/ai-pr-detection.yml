name: AI PR Detection

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-ai-generated-prs:
    name: Detect AI-Generated PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check PR description for AI patterns
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Common AI-generated patterns
          ai_patterns=(
            "This PR was generated by"
            "AI-generated"
            "automatically generated"
            "bot-generated"
            "generated using AI"
            "created by AI"
            "AI assistant"
            "Claude Code"
            "Copilot"
            "ChatGPT"
            "GPT-4"
            "automated PR"
            "auto-generated"
          )

          # Check PR title
          for pattern in "${ai_patterns[@]}"; do
            if echo "$PR_TITLE" | grep -iq "$pattern"; then
              echo "::error::PR title contains AI-generated pattern: $pattern"
              echo "::error::AI-generated PRs are not allowed for contributor status."
              exit 1
            fi
          done

          # Check PR body
          for pattern in "${ai_patterns[@]}"; do
            if echo "$PR_BODY" | grep -iq "$pattern"; then
              echo "::error::PR description contains AI-generated pattern: $pattern"
              echo "::error::AI-generated PRs are not allowed for contributor status."
              exit 1
            fi
          done

          # Check for generic AI-generated descriptions
          generic_patterns=(
            "This pull request implements"
            "This change adds"
            "This commit adds"
            "Updated the code to"
            "Fixed the issue by"
            "Improved the"
            "Enhanced the"
            "Optimized the"
            "Refactored the"
          )

          for pattern in "${generic_patterns[@]}"; do
            if echo "$PR_BODY" | grep -iq "^$pattern"; then
              echo "::warning::PR description starts with generic AI-like pattern: $pattern"
              echo "::warning::Please provide a specific, human-written description."
            fi
          done

          echo "✓ No obvious AI-generated patterns detected"

      - name: Check commit messages for AI patterns
        run: |
          # Get all commit messages for this PR
          commits=$(git log --pretty=format:"%s" ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})

          # Common AI-generated commit patterns
          ai_commit_patterns=(
            "Update files"
            "Update code"
            "Fix bug"
            "Add feature"
            "Implement"
            "Refactor"
            "Optimize"
            "Improve"
            "Enhance"
          )

          for commit in $commits; do
            for pattern in "${ai_commit_patterns[@]}"; do
              if echo "$commit" | grep -iq "^$pattern$"; then
                echo "::warning::Commit message appears generic/AI-generated: $commit"
                echo "::warning::Please use specific, descriptive commit messages."
              fi
            done
          done

      - name: Check for new contributor
        if: github.event.pull_request.author_association == 'NONE' || github.event.pull_request.author_association == 'FIRST_TIMER'
        run: |
          echo "::notice::New contributor detected. PR will require additional review."
          echo "::notice::Please ensure this PR is genuinely human-written and adds value."

      - name: Check for suspicious file changes
        run: |
          # Check for changes to only documentation or trivial files
          changed_files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          
          # Count files changed
          file_count=$(echo "$changed_files" | wc -l)
          
          # If only README or trivial files changed, flag it
          if [ $file_count -le 2 ]; then
            only_docs=true
            for file in $changed_files; do
              if [[ ! "$file" =~ (README|CHANGELOG|\.md$) ]]; then
                only_docs=false
                break
              fi
            done
            
            if [ "$only_docs" = true ]; then
              echo "::warning::Only documentation files changed. This may be a low-effort PR."
              echo "::warning::Please ensure your PR adds meaningful value to the codebase."
            fi
          fi

      - name: Success
        run: |
          echo "✓ PR passed AI detection checks"
          echo "Note: These checks are heuristic. Maintainers should still review PRs carefully."
