name: Location-Based PR Restrictions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-contributor-location:
    name: Check Contributor Location
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get contributor location
        id: location
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the PR author's username
          AUTHOR="${{ github.event.pull_request.user.login }}"
          
          # Fetch user profile information using GitHub API
          USER_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/users/$AUTHOR")
          
          # Extract location if available
          LOCATION=$(echo "$USER_INFO" | grep -o '"location":[^,]*' | cut -d'"' -f4)
          
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"
          
          echo "Author: $AUTHOR"
          echo "Location: $LOCATION"

      - name: Check for restricted locations
        if: steps.location.outputs.location != ''
        env:
          LOCATION: ${{ steps.location.outputs.location }}
          AUTHOR: ${{ steps.location.outputs.author }}
        run: |
          # Normalize location to lowercase for comparison
          LOCATION_LOWER=$(echo "$LOCATION" | tr '[:upper:]' '[:lower:]')
          
          # Check for Bangladesh
          if echo "$LOCATION_LOWER" | grep -iq "bangladesh\|bd"; then
            echo "::error::Contributor location ($LOCATION) is in a restricted region."
            echo "::error::PRs from Bangladesh are not accepted."
            exit 1
          fi
          
          # Check for India
          if echo "$LOCATION_LOWER" | grep -iq "india\|ind\|in"; then
            echo "::error::Contributor location ($LOCATION) is in a restricted region."
            echo "::error::PRs from India are not accepted."
            exit 1
          fi
          
          echo "✓ Location check passed"

      - name: Warn if no location set
        if: steps.location.outputs.location == ''
        run: |
          echo "::warning::Contributor has no location set in their GitHub profile."
          echo "::warning::Please set your location for verification purposes."
