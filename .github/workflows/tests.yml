name: Lint & Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-validation:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate --strict .claude-plugin/marketplace.json
          npx --yes @anthropic-ai/claude-code plugin validate --strict .claude-plugin/plugin.json

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # See the rationale above the typescript-tests step. 80% is the
      # realistic sustainable bar across both SDKs at this stage.
      - name: Run Python tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Run TypeScript tests
        run: npx vitest run --coverage --coverage.thresholds.lines=80

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust

      - name: Build (default + tunnels-runtime)
        run: |
          cargo build
          cargo build --features tunnels-runtime

      - name: Run tests (default features)
        run: cargo test

      - name: Run tests (tunnels-runtime)
        run: cargo test --features tunnels-runtime

      - name: Clippy
        run: cargo clippy --all-targets --features tunnels-runtime -- -D warnings

      - name: Format check
        run: cargo fmt --check

  rust-msrv:
    name: Rust SDK (MSRV)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Keep in sync with `rust-version` in sdk/rust/Cargo.toml. The published
      # crate's floor is set by its transitive graph, not by its own source, so
      # it can regress silently when a dependency bumps its own MSRV — hence
      # this job. `rust-tests` above covers stable.
      - name: Set up Rust (declared MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust

      - name: Build (default + tunnels-runtime)
        run: |
          cargo build --locked
          cargo build --locked --features tunnels-runtime

      - name: Run tests (default + tunnels-runtime)
        run: |
          cargo test --locked
          cargo test --locked --features tunnels-runtime

  rust-example:
    name: Rust Example (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/use-inkbox-rust
    strategy:
      fail-fast: false
      matrix:
        # Keep the first entry in sync with `rust-version` in
        # examples/use-inkbox-rust/Cargo.toml. The committed Cargo.lock is what
        # makes that minimum reproducible, so every step below uses --locked.
        toolchain: ["1.86.0", "stable"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/use-inkbox-rust

      - name: Build all example binaries
        run: cargo build --locked --bins

      # Lint sets drift between compiler releases, so a pinned-toolchain clippy
      # run would fail on lints the MSRV build has no say over. Gate on stable.
      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format check
        if: matrix.toolchain == 'stable'
        run: cargo fmt --check

  rust-example-fresh-resolution:
    name: Rust Example (unpinned dependency drift)
    runs-on: ubuntu-latest
    # Advisory: warns when the latest dependency graph outgrows the documented
    # minimum toolchain, without blocking PRs that did not cause the drift.
    continue-on-error: true
    defaults:
      run:
        working-directory: examples/use-inkbox-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust (documented minimum)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"

      - name: Build against a freshly resolved dependency graph
        run: |
          rm -f Cargo.lock
          cargo build --bins
