name: Lint & Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-validation:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate --strict .claude-plugin/marketplace.json
          npx --yes @anthropic-ai/claude-code plugin validate --strict .claude-plugin/plugin.json

  python-tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Python Tests
            coverage: true
          # Windows keeps the full suite for platform signal; lint and the
          # coverage gate are OS-independent, so they only run on Linux.
          - os: windows-latest
            name: Python Tests (Windows)
            coverage: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        if: matrix.coverage
        run: ruff check .

      # 80% is the realistic sustainable bar across both SDKs at this stage.
      - name: Run Python tests
        if: matrix.coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Run Python tests (no coverage)
        if: ${{ !matrix.coverage }}
        run: pytest

  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc` over the same project, so it is the type check.
      - name: Type check, build, and check public type contracts
        run: npm run build && npx tsc --noEmit -p tsconfig.contract-tests.json

      - name: Run TypeScript tests
        run: npx vitest run --coverage --coverage.thresholds.lines=80

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust

      - name: Format check
        run: cargo fmt --check

      # Features are additive and no test is gated on the feature being off,
      # so one test run with tunnels-runtime covers the default-feature tests;
      # clippy on the default set keeps its build checked.
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (tunnels-runtime)
        run: cargo clippy --all-targets --features tunnels-runtime -- -D warnings

      - name: Run tests (tunnels-runtime)
        run: cargo test --features tunnels-runtime

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            cli/package-lock.json

      - name: Validate CLI publish dry run from a clean checkout
        working-directory: cli
        run: ./publish.sh

      - name: Run CLI tests against the local SDK
        working-directory: cli
        run: npm test
